[package]
name = "fixplor"
version = "0.1.22"
description = "fixplor: ファイルエクスプローラー"
edition = "2021"
publish = false

[lib]
name = "fixplor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset: 画像のサムネイルを、ファイルから直接読む（asset の URL）
tauri = { version = "2", features = ["devtools", "protocol-asset"] }
# ファイルを既定のアプリで開く
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ホーム・デスクトップ・ダウンロードなどの場所
dirs = "6"
# 書き込みのパス（ヘッダーで受ける）の復号。WebDAV の URL の符号化にも使う
percent-encoding = "2"
# WebDAV（ネットワークドライブ）。TLS は rustls（デスクトップは OS の証明書の保管庫を使う。Android は同梱の証明書。openssl は使わない）
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream"] }
# 証明書の指紋の固定（自己署名・私的 CA）。rustls は reqwest が使っているものと同じ（ring。aws-lc は入れない）。sha2 は指紋（SHA-256）
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
# PROPFIND の応答（XML）の解析
quick-xml = "0.42"
# 送信・受信のストリームと進み具合・ファイルへの書き込み（reqwest・tauri が使っているものと同じ）
tokio = { version = "1", features = ["fs", "io-util", "time", "sync", "rt"] }
futures-util = "0.3"
bytes = "1"

# OS のゴミ箱（Linux: freedesktop の Trash、Windows: ごみ箱）。Android には無い
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
trash = "5"
# アプリの更新の確認・入れ替え（署名つき。latest.json はリリースに載せる）と、更新後の再起動。デスクトップだけ（Android のビルドは無い）
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# 資格情報（WebDAV のユーザー名・パスワード）は OS のキーチェーンへ（Linux: Secret Service・Windows: 資格情報マネージャー）。openssl は使わない
keyring = "4"

# OS のクリップボードにファイルを書く（clipboard/）。Linux は GTK のクリップボード（tauri が使っているものと同じ）、Windows は Win32 の API
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory"] }

[dev-dependencies]
tempfile = "3"
# WebDAV の試験用の模擬サーバー
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
# 証明書の固定の試験用の、小さな TLS サーバー（試験の証明書は webdav/fixtures に置いた固定のもの。作る道具は入れない）
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

# Android の全ファイルへのアクセス（確認と設定画面）。Android だけ
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-fixplor-storage = { path = "plugins/storage" }
tauri-plugin-fixplor-updater = { path = "plugins/updater" }
# Android には、rustls が読める OS の証明書の置き場所が無い（native-roots は何も見つけない）ので、同梱の証明書（Mozilla）も使う。これが無いと、公開の CA の https が、すべて証明書で失敗する
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "stream"] }
